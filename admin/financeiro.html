<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Financeiro | ADSA IPÊ SYSTEM</title>


<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/design-system.css">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">


</head>


<body>


<header class="header">

<div class="container header-content">


<div class="logo">
ADSA IPÊ SYSTEM
</div>


<nav class="nav">

<a href="dashboard.html">
Dashboard
</a>

<a href="membros.html">
Membros
</a>

<a href="financeiro.html">
Financeiro
</a>

<a href="eventos.html">
Eventos
</a>

<a href="../index.html">
Sair
</a>


</nav>


</div>

</header>





<main>


<section class="section">


<div class="container">



<h1>
Financeiro
</h1>

<p>
Controle financeiro da igreja.
</p>






<!-- RESUMO -->


<div class="stats-grid">


<div class="card stat-card">

<div class="stat-number" id="total-entradas">
R$ 0,00
</div>

<div class="stat-label">
Entradas
</div>

</div>





<div class="card stat-card">

<div class="stat-number" id="total-saidas">
R$ 0,00
</div>

<div class="stat-label">
Saídas
</div>

</div>





<div class="card stat-card">

<div class="stat-number" id="saldo">
R$ 0,00
</div>

<div class="stat-label">
Saldo
</div>

</div>





<div class="card stat-card">

<div class="stat-number" id="total-dizimos">
R$ 0,00
</div>

<div class="stat-label">
Dízimos
</div>

</div>



</div>









<!-- FORMULARIO -->


<div class="card">


<h2>
Novo lançamento
</h2>




<div class="form-group">

<label>
Tipo
</label>


<select id="tipo">


<option value="entrada">
Entrada
</option>


<option value="saida">
Saída
</option>


</select>


</div>





<div class="form-group">


<label>
Categoria
</label>


<select id="categoria">


<option>
Dízimo
</option>

<option>
Oferta
</option>

<option>
Doação
</option>

<option>
Despesa
</option>

<option>
Outros
</option>


</select>


</div>






<div class="form-group">

<label>
Descrição
</label>


<input 
id="descricao"
type="text"
placeholder="Ex: Oferta culto domingo"
>


</div>







<div class="form-group">

<label>
Valor
</label>


<input
id="valor"
type="number"
placeholder="100.00"
>


</div>







<div class="form-group">

<label>
Data
</label>


<input
id="data"
type="date"
>


</div>





<button 
class="btn-primary"
id="salvar"
>

Salvar lançamento

</button>



<button
class="btn-secondary"
id="cancelar"
style="display:none"
>

Cancelar edição

</button>




</div>









<!-- TABELA -->


<div class="card table-container">


<h2>
Histórico
</h2>



<table class="members-table">


<thead>

<tr>

<th>
Data
</th>


<th>
Descrição
</th>


<th>
Categoria
</th>


<th>
Tipo
</th>


<th>
Valor
</th>


<th>
Ações
</th>


</tr>


</thead>



<tbody id="tabela">

</tbody>


</table>



</div>




</div>

</section>


</main>





<script src="../js/main.js"></script>

<script src="../js/financeiro.js"></script>


</body>


</html>
