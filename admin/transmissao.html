<section class="section">


<div class="container">



<h1>

Transmissão ao vivo

</h1>


<p>

Controle das transmissões da igreja.

</p>







<div class="card">


<h2>

Status da transmissão

</h2>



<div id="status-live">

🔴 Offline

</div>



</div>









<div class="card">


<h2>

Configurar transmissão

</h2>





<div class="form-group">


<label>

Título da transmissão

</label>


<input 
id="titulo-live"
type="text"
placeholder="Ex: Culto de Domingo"
>


</div>







<div class="form-group">


<label>

Link da transmissão

</label>


<input 
id="link-live"
type="url"
placeholder="https://youtube.com/live/..."
>


</div>








<button 
class="btn-primary"
id="iniciar-live">

🔴 Iniciar transmissão

</button>




<button 
class="btn-delete"
id="encerrar-live">

⛔ Encerrar transmissão

</button>




</div>





</div>
