<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ADSA IPÊ SYSTEM - Login</title>


    <link rel="stylesheet" href="css/login.css">

</head>


<body>


<div class="login-container">


    <h1>
        ADSA IPÊ SYSTEM
    </h1>


    <p>
        Acesso administrativo
    </p>



    <div class="form">


        <input
            id="email"
            type="email"
            placeholder="Email"
        >



        <input
            id="senha"
            type="password"
            placeholder="Senha"
        >



        <button onclick="fazerLogin()">

            Entrar

        </button>


    </div>


</div>



<script src="js/login.js"></script>


</body>

</html>
